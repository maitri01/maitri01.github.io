<article class="publication-card">
  <a class="publication-visual" href="/research/{{ .slug }}/" aria-label="Read about {{ .title }}: {{ .subtitle }}"><img src="/images/{{ .graphic }}.svg" width="640" height="250" alt="{{ if eq .graphic "radioactivity" }}Concept diagram showing watermarked images, model training, and a radioactivity test{{ else }}Concept diagram showing watermark signals fading across model iterations{{ end }}" loading="lazy"></a>
  <div class="publication-body"><p class="eyebrow">{{ .venue }}</p><h3><a href="/research/{{ .slug }}/">{{ .title }}<span>{{ .subtitle }}</span></a></h3><p>{{ .summary }}</p><div class="paper-links"><a href="{{ .paper }}">Paper <span aria-hidden="true">↗</span></a>{{ with .code }}<a href="{{ . }}">Code <span aria-hidden="true">↗</span></a>{{ end }}<a href="/research/{{ .slug }}/">Overview <span aria-hidden="true">→</span></a></div></div>
</article>
