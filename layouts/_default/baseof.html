<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} | {{ end }}Maitri Shah</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <meta name="theme-color" content="#782f40">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:title" content="{{ if not .IsHome }}{{ .Title }} | {{ end }}Maitri Shah">
  <meta property="og:description" content="{{ .Description | default .Site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "images/maitri.jpg" | absURL }}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alata&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/bootstrap-5/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/portfolio.css">
  <script src="/js/navigation.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="/" aria-label="Maitri Shah home"><span class="brand-mark" aria-hidden="true">m.</span> Maitri Shah</a>
      <button class="menu-toggle" type="button" aria-controls="primary-menu" aria-expanded="false">Menu <span aria-hidden="true">☰</span></button>
      <nav id="primary-menu" aria-label="Main navigation">
        {{ $current := .RelPermalink }}
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" {{ if or (eq $current .URL) (and (ne .URL "/") (hasPrefix $current .URL)) }}aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
        <a class="nav-cv" href="/assets/pdf/Maitri_Shah_CV.pdf" download>Download CV <span aria-hidden="true">↓</span></a>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer"><div class="footer-shell">
    <p>© {{ now.Year }} Maitri Vignesh Shah <span>Saarbrücken, Germany</span></p>
    {{ partial "profile-links.html" . }}
  </div></footer>
</body>
</html>
